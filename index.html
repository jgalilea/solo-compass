<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Aplica el tema y el modo claro/oscuro guardados antes del
      // primer pintado, para evitar un parpadeo con los valores por
      // defecto al cargar.
      try {
        var t = localStorage.getItem("solo-compass:theme");
        if (t) document.documentElement.setAttribute("data-theme", t);

        var m = localStorage.getItem("solo-compass:mode") || "dark";
        if (m === "auto") {
          m =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-mode", m);
        document.documentElement.style.colorScheme = m;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/solo-compass/favicon.svg" />
    <link rel="apple-touch-icon" href="/solo-compass/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="description" content="Oráculo de sí o no, más de 750 tablas, dados, cartas y un diario en Lonelog para jugar rol en solitario. Sin cuenta, sin conexión y todo en tu dispositivo." />
    <title>Solo Compass</title>
    <!-- The card shown when the link is shared (image: scripts/og-image.mjs).
         Absolute URLs: the sites that read them don't resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solo Compass" />
    <meta property="og:title" content="Solo Compass · Oráculo, tablas y diario para rol en solitario" />
    <meta property="og:description" content="Gratis, sin cuenta y sin conexión: pregunta al oráculo, tira en más de 750 tablas y escribe tu diario en Lonelog. Todo se queda en tu dispositivo. · Oracle, tables and journal for solo role-playing." />
    <meta property="og:url" content="https://jgalilea.github.io/solo-compass/" />
    <meta property="og:image" content="https://jgalilea.github.io/solo-compass/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Solo Compass: el oráculo respondiendo en un móvil, junto al emblema de la rosa de los vientos" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
