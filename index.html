<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Aplica el tema y el modo claro/oscuro guardados antes del
      // primer pintado, para evitar un parpadeo con los valores por
      // defecto al cargar.
      try {
        var t = localStorage.getItem("solo-compass:theme");
        if (t) document.documentElement.setAttribute("data-theme", t);

        var m = localStorage.getItem("solo-compass:mode") || "dark";
        if (m === "auto") {
          m =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-mode", m);
        document.documentElement.style.colorScheme = m;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/solo-compass/favicon.svg" />
    <link rel="apple-touch-icon" href="/solo-compass/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="description" content="Oráculo Recluse y tablas de significado para guiar partidas de rol en solitario." />
    <title>Solo Compass</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
