name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned: ubuntu-latest is Ubuntu 26.04 since 2026-10-19, and its
    # Ubuntu mirrors kept failing to resolve while installing the
    # browser's system packages (each run waited ~10 minutes on them).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Smoke test in a real browser against the build (playwright.config.ts).
      # The system packages come from Ubuntu's mirrors, which the runner
      # sometimes can't reach: give them 3 minutes, then install the
      # browser alone (the image already has what Chromium needs).
      - run: timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
